name: Yapd
options:
  bundleIdPrefix: com.ifthenelse
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Version.xcconfig
  Release: Config/Version.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    # A stable signing identity is required for macOS to remember privacy
    # permissions (microphone, system audio, accessibility) across builds.
    DEVELOPMENT_TEAM: M97QJXJV2J
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Yapd:
    type: application
    platform: macOS
    sources:
      - path: Yapd
    info:
      path: Yapd/App/Info.plist
      properties:
        CFBundleDisplayName: Yapd
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: ""
        NSMicrophoneUsageDescription: "Yapd records your microphone so your side of a meeting is captured alongside the call audio."
        NSAudioCaptureUsageDescription: "Yapd records the audio played by apps like Teams, Zoom, or Meet so the other participants are captured. Audio stays on this Mac."
    postBuildScripts:
      # Runs last, before code signing, so the stamped values are part of the signature.
      - name: Embed build info
        basedOnDependencyAnalysis: false
        script: |
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          commit=$(git -C "$SRCROOT" describe --always --dirty --abbrev=10 2>/dev/null || echo unknown)
          date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          for entry in "YapdGitCommit:$commit" "YapdBuildDate:$date"; do
            key=${entry%%:*}; value=${entry#*:}
            /usr/libexec/PlistBuddy -c "Delete :$key" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :$key string $value" "$plist"
          done
          # Finder caches a bundle's icon keyed on the bundle's own modification
          # date, which Xcode doesn't update, so a changed icon would never show.
          touch "$TARGET_BUILD_DIR/$FULL_PRODUCT_NAME"
    entitlements:
      path: Yapd/App/Yapd.entitlements
      properties:
        com.apple.security.app-sandbox: false
        # Hardened Runtime blocks the microphone (silently, with no prompt)
        # unless this is declared.
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ifthenelse.Yapd
        PRODUCT_NAME: Yapd
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets: []
      gatherCoverageData: false
